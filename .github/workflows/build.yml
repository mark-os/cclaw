name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  linux-x64:
    name: linux-x64 (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev xxd

      - name: Allow unprivileged user namespaces
        # ubuntu-latest (24.04) restricts CLONE_NEWUSER via AppArmor by
        # default; cclaw's namespace sandbox (and its tests) need it.
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        run: make all

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

      - name: Package
        # Strip + zip so every target unpacks to the same binary name —
        # install is "download, unzip, ./cclaw" regardless of target.
        run: |
          mkdir -p dist
          strip -o dist/cclaw build/cclaw
          chmod +x dist/cclaw
          (cd dist && zip -q cclaw-linux-x64.zip cclaw && rm cclaw)

      - uses: actions/upload-artifact@v4
        with:
          name: cclaw-linux-x64
          path: dist/cclaw-linux-x64.zip

  websocket-transport:
    name: websocket transport (libcurl with ws)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev xxd

      - name: Build a WS-capable libcurl
        # No distro libcurl can carry the conn.* transport: they ship without
        # the ws/wss handlers, and even a ws-enabled build below 8.13.0 cannot
        # delimit a fragmented message (older frame flags never surfaced FIN —
        # see curl_ws_available in src/util.c). On such a libcurl the gateway
        # suites skip, which is how a broken reassembly path once sat green for
        # months. This job exists to make them actually run.
        run: |
          curl -sSLo curl.tar.gz https://curl.se/download/curl-${CURL_VERSION}.tar.gz
          tar xzf curl.tar.gz
          cd curl-${CURL_VERSION}
          ./configure --prefix=/opt/curlws --with-openssl --enable-websockets \
            --disable-ldap --disable-ldaps --disable-manual --without-libpsl \
            --without-brotli --without-zstd --without-libidn2 \
            --without-nghttp2 --without-libssh2 >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install >/dev/null
        env:
          CURL_VERSION: 8.21.0

      - name: Allow unprivileged user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        run: make all

      - name: Integration tests
        # Built against the system libcurl, run against the WS-capable one —
        # same soname, so LD_LIBRARY_PATH is enough.
        run: LD_LIBRARY_PATH=/opt/curlws/lib make test-integration

      - name: Verify the WS suites actually ran
        # Without this the job is self-defeating: if the libcurl above stops
        # taking effect, both suites skip and the job still reports green —
        # exactly the failure mode it was added to catch.
        run: |
          rc=0
          for t in channel_conn channel_discord; do
            log="/tmp/cclaw_test_integration_$t.txt"
            if grep -q SKIP "$log"; then
              echo "::error::test_integration_$t skipped — WS libcurl not in effect"
              cat "$log"
              rc=1
            fi
          done
          exit $rc

  linux-x86:
    name: linux-x86 (i386, libcurl4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test in i386 container
        run: |
          docker run --rm --platform linux/386 -v "$PWD":/src -w /src \
            i386/debian:bookworm bash -c '
              set -e
              apt-get update
              apt-get install -y build-essential libcurl4-openssl-dev xxd git
              git config --global --add safe.directory /src
              make all
              make smoke
            '

      - name: Package
        run: |
          mkdir -p dist
          strip -o dist/cclaw build/cclaw
          chmod +x dist/cclaw
          (cd dist && zip -q cclaw-linux-x86.zip cclaw && rm cclaw)

      - uses: actions/upload-artifact@v4
        with:
          name: cclaw-linux-x86
          path: dist/cclaw-linux-x86.zip

  linux-armv5te:
    name: linux-armv5te (Pogoplug, armel, libcurl4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in armel container
        # Build the target, then run the actual binary (not the unit-test
        # harness) under qemu-arm as a live smoke check: --version proves
        # dynamic linking against the emulated armel libcurl.so works,
        # --doctor exercises DB/config/workspace/sandbox-probe end to end.
        # Neither touches readdir()-heavy paths, so this avoids the
        # getdents64 translation flakiness that broke `make smoke` here.
        run: |
          docker run --rm --platform linux/arm/v5 -v "$PWD":/src -w /src \
            arm32v5/debian:bookworm bash -c '
              set -e
              # Skip docs/man pages and recommended-but-unneeded packages —
              # dpkg unpacking + man-db trigger processing is the slowest,
              # most hang-prone part of this job under qemu-arm emulation,
              # and neither is needed for a CI build.
              mkdir -p /etc/dpkg/dpkg.cfg.d
              printf "path-exclude /usr/share/doc/*\npath-exclude /usr/share/man/*\npath-exclude /usr/share/groff/*\npath-exclude /usr/share/info/*\n" > /etc/dpkg/dpkg.cfg.d/01_nodoc
              apt-get update
              apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev xxd git
              git config --global --add safe.directory /src
              # ARMv5TE has no hardware CAS instruction, so the 8-byte atomic
              # builtins quickjs and sqlite emit become libatomic calls. The
              # Makefile's link probe detects that; this job is where it gets
              # exercised, so don't paper over it with an explicit LDFLAGS.
              make all
              strip build/cclaw
              ./build/cclaw --version
              ./build/cclaw --doctor
            '

      - name: Package
        run: |
          mkdir -p dist
          cp build/cclaw dist/cclaw
          chmod +x dist/cclaw
          (cd dist && zip -q cclaw-linux-armv5te.zip cclaw && rm cclaw)

      - uses: actions/upload-artifact@v4
        with:
          name: cclaw-linux-armv5te
          path: dist/cclaw-linux-armv5te.zip

  release:
    name: Publish release
    needs: [linux-x64, websocket-transport, linux-x86, linux-armv5te]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(mktemp)
          cat <<EOF | sed 's/^[[:space:]]*//' > "$notes"
          ## Install

          Same \`cclaw\` binary name in every zip — pick your target, download, unzip, run:

          \`\`\`sh
          curl -LO https://github.com/$REPO/releases/download/$TAG/cclaw-linux-x64.zip
          unzip cclaw-linux-x64.zip
          ./cclaw --version
          \`\`\`

          Swap \`cclaw-linux-x64.zip\` for \`cclaw-linux-x86.zip\` (32-bit x86) or
          \`cclaw-linux-armv5te.zip\` (ARMv5TE, e.g. Pogoplug V4) as needed — same
          three commands either way.
          EOF
          gh release create "$TAG" \
            dist/cclaw-linux-x64/cclaw-linux-x64.zip \
            dist/cclaw-linux-x86/cclaw-linux-x86.zip \
            dist/cclaw-linux-armv5te/cclaw-linux-armv5te.zip \
            --title "$TAG" \
            --notes-file "$notes"
