name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Two concerns, kept apart:
#  - test / compat: the *source build* path (host libc, system libcurl), which
#    is what `make` does on a user's machine. Nothing here is shipped.
#  - release: the artifacts. Static musl binaries with curl + mbedTLS inside,
#    cross-compiled on one x64 runner by scripts/build_static.sh, and tested
#    as built — the binary that is tested is the binary that ships.

jobs:
  test:
    name: test (${{ matrix.name }}, source build)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   runner: ubuntu-latest }
          - { name: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev xxd

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict CLONE_NEWUSER via AppArmor by
        # default; cclaw's namespace sandbox (and its tests) need it.
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        run: make all

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

  compat:
    name: compat (source build on an old distro, compile only)
    # Rocky 9 carries libcurl 7.76 (no WebSocket API) and gcc 11: the oldest
    # toolchain a source build is expected to survive. Nothing is run — the
    # question is only whether it still compiles and links.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: rockylinux:9
    steps:
      - name: Install dependencies
        run: dnf -y install gcc make git libcurl-devel vim-common diffutils findutils

      - uses: actions/checkout@v4

      - name: Build
        run: |
          git config --global --add safe.directory "$PWD"
          curl-config --version
          make all

  release-build:
    name: release (${{ matrix.target }}, static musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x64,     packages: "" }
          - { target: arm64,   packages: gcc-aarch64-linux-gnu,  strip: aarch64-linux-gnu-strip }
          - { target: i586,    packages: gcc-i686-linux-gnu qemu-user, strip: i686-linux-gnu-strip }
          - { target: armv5te, packages: gcc-arm-linux-gnueabi,  strip: arm-linux-gnueabi-strip, qemu_cpu: arm926 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Pin the emulated CPU
        # qemu-user reads QEMU_CPU, including when it is entered through
        # binfmt: the armv5te binary runs on an ARM926, so an instruction from
        # a later architecture (leaked in through a library) is SIGILL here
        # rather than on a Pogoplug. Set only where a model is named — an
        # empty value is not "default", it is an unknown CPU.
        if: matrix.qemu_cpu
        run: echo "QEMU_CPU=${{ matrix.qemu_cpu }}" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd ${{ matrix.packages }}

      - name: Register qemu for foreign binaries
        # cclaw re-executes itself (/proc/self/exe) for tools and channels, so
        # the smoke tests need the kernel to hand foreign ELF files to qemu —
        # prefixing one command with qemu-arm would not cover the children.
        if: matrix.target != 'x64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Cache musl, mbedTLS and curl
        uses: actions/cache@v4
        with:
          path: |
            build-deps/dl
            build-deps/${{ matrix.target }}/prefix
          key: static-deps-${{ matrix.target }}-${{ hashFiles('scripts/build_static.sh') }}

      - name: Allow unprivileged user namespaces
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Build
        # Asserts on its own that the result has no dynamic dependencies.
        run: scripts/build_static.sh "$TARGET"

      - name: Unit and integration tests against the artifact
        # x64 only: the full suites, built static like the binary they drive.
        if: matrix.target == 'x64'
        run: |
          scripts/build_static.sh "$TARGET" test
          scripts/build_static.sh "$TARGET" test-integration

      - name: Verify the WebSocket suites actually ran
        # The artifact carries a ws-capable libcurl, so a SKIP here means the
        # transport silently fell out of the build — the failure mode that
        # once let a broken reassembly path sit green for months.
        if: matrix.target == 'x64'
        run: |
          rc=0
          for t in channel_conn channel_discord; do
            log="/tmp/cclaw_test_integration_$t.txt"
            if grep -q SKIP "$log"; then
              echo "::error::test_integration_$t skipped — no WebSocket transport in the artifact"
              cat "$log"
              rc=1
            fi
          done
          exit $rc

      - name: Smoke-test the artifact
        # Every target, emulated where foreign. Three things a static binary
        # can get wrong that compiling cannot show: it starts at all, it can
        # open a DB and probe its environment, and it can resolve a name,
        # find the host CA bundle and finish a TLS handshake. The request
        # carries a deliberately invalid key; any HTTP 4xx proves the
        # handshake and the HTTP exchange both completed.
        run: |
          set -x
          file build/cclaw
          ./build/cclaw --version
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          ./build/cclaw --doctor
          OPENROUTER_API_KEY=sk-or-v1-invalid-ci-smoke-key \
            timeout 180 ./build/cclaw -v -p "hi" </dev/null >"$RUNNER_TEMP/turn.log" 2>&1 || true
          grep -E "llm_req: .*status=" "$RUNNER_TEMP/turn.log" || { cat "$RUNNER_TEMP/turn.log"; exit 1; }
          grep -Eq "llm_req: .*status=4[0-9][0-9]" "$RUNNER_TEMP/turn.log"

      - name: Smoke-test the JS engine on the target
        # test_quickjs covers the 8-byte atomics that armv5te gets from
        # scripts/atomic8_fallback.c instead of libatomic.
        if: matrix.target != 'x64'
        run: |
          scripts/build_static.sh "$TARGET" build/test_quickjs
          ./build/test_quickjs

      - name: Check the i586 baseline
        # The runner's CPU executes i686+ instructions happily; a Pentium
        # does not. Run the binary on an emulated one.
        if: matrix.target == 'i586'
        run: |
          qemu-i386 -cpu pentium ./build/cclaw --version
          qemu-i386 -cpu pentium ./build/test_quickjs

      # Two shapes of the same binary. The zip is for a human following the
      # release notes; the bare file is what `cclaw update` fetches, so the
      # updater needs no archive decoder and no unzip on the target.
      - name: Package
        run: |
          mkdir -p dist
          ${{ matrix.strip || 'strip' }} -o dist/cclaw build/cclaw
          chmod +x dist/cclaw
          (cd dist && zip -q "cclaw-linux-$TARGET.zip" cclaw)
          mv dist/cclaw "dist/cclaw-linux-$TARGET"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: cclaw-linux-${{ matrix.target }}
          path: |
            dist/cclaw-linux-${{ matrix.target }}.zip
            dist/cclaw-linux-${{ matrix.target }}

  whatsapp-bridge:
    name: whatsapp-bridge (x64 native + armv5te cross)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Install Rust toolchain
        # The pin lives in bridge/whatsapp/rust-toolchain.toml (it must match
        # whatsapp-rust's own pin; a git dependency's pin does not propagate).
        working-directory: bridge/whatsapp
        run: |
          TC=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)
          rustup toolchain install "$TC" --profile minimal
          rustup target add --toolchain "$TC" armv5te-unknown-linux-gnueabi

      - name: Build (x64 + armv5te)
        working-directory: bridge/whatsapp
        env:
          CARGO_TARGET_ARMV5TE_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
        run: |
          cargo build --release
          cargo build --release --target armv5te-unknown-linux-gnueabi

      - name: Package
        # Bare binaries only (no zip): the bridge is installed by an operator
        # following specs/whatsapp.md, not by cclaw update.
        run: |
          mkdir -p dist
          strip -o dist/whatsapp-bridge-linux-x64 bridge/whatsapp/target/release/whatsapp-bridge
          arm-linux-gnueabi-strip -o dist/whatsapp-bridge-linux-armv5te bridge/whatsapp/target/armv5te-unknown-linux-gnueabi/release/whatsapp-bridge
          chmod +x dist/whatsapp-bridge-linux-*
          sha256sum dist/whatsapp-bridge-linux-*

      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-bridge
          path: |
            dist/whatsapp-bridge-linux-x64
            dist/whatsapp-bridge-linux-armv5te

  release:
    name: Publish release
    needs: [test, compat, release-build, whatsapp-bridge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(mktemp)
          cat <<EOF | sed 's/^[[:space:]]*//' > "$notes"
          ## Install

          Same \`cclaw\` binary name in every zip — pick your target, download, unzip, run:

          \`\`\`sh
          curl -LO https://github.com/$REPO/releases/download/$TAG/cclaw-linux-x64.zip
          unzip cclaw-linux-x64.zip
          ./cclaw --version
          \`\`\`

          Swap \`cclaw-linux-x64.zip\` for \`cclaw-linux-arm64.zip\` (64-bit ARM, e.g. Graviton),
          \`cclaw-linux-i586.zip\` (32-bit x86, Pentium and later) or
          \`cclaw-linux-armv5te.zip\` (ARMv5TE, e.g. Pogoplug V4) as needed — same
          three commands either way. The binaries are statically linked
          (musl, with libcurl and TLS inside): they need no particular libc or
          libcurl on the host, only a CA certificate bundle.

          Each target is also attached unzipped (same name without \`.zip\`) —
          that is what \`cclaw update\` downloads, verifying it against
          \`checksums.b2\` (BLAKE2b-512, \`b2sum -c checksums.b2\`).
          EOF
          assets="dist/cclaw-linux-x64/cclaw-linux-x64.zip
            dist/cclaw-linux-arm64/cclaw-linux-arm64.zip
            dist/cclaw-linux-i586/cclaw-linux-i586.zip
            dist/cclaw-linux-armv5te/cclaw-linux-armv5te.zip
            dist/cclaw-linux-x64/cclaw-linux-x64
            dist/cclaw-linux-arm64/cclaw-linux-arm64
            dist/cclaw-linux-i586/cclaw-linux-i586
            dist/cclaw-linux-armv5te/cclaw-linux-armv5te
            dist/whatsapp-bridge/whatsapp-bridge-linux-x64
            dist/whatsapp-bridge/whatsapp-bridge-linux-armv5te"
          # Basenames only: `cclaw update` looks its asset up by name, and
          # `b2sum -c` from a download directory expects the same.
          for a in $assets; do (cd "$(dirname "$a")" && b2sum "$(basename "$a")"); done > dist/checksums.b2
          cat dist/checksums.b2
          assets="$assets dist/checksums.b2"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Release already exists (retagged, or notes written ahead of the
            # build): replace its binaries, leave title/notes alone.
            gh release upload "$TAG" $assets --clobber --repo "$REPO"
          else
            gh release create "$TAG" $assets \
              --title "$TAG" \
              --notes-file "$notes"
          fi
