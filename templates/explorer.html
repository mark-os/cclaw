<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>cclaw</title>
<style>
/* The operator's page (specs/explorer.md): the data explorer and its
   actions. One page, no external requests: system fonts, no images,
   everything drawn with textContent. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --fg: #171b24; --muted: #5a6272; --line: #d9dde4;
  --link: #0a3fc9; --focus: #0a3fc9;
  --ok: #1f7a45; --ok-bg: #e3f3e9; --warn: #8a5200; --warn-bg: #fbefd6;
  --bad: #b3261e; --bad-bg: #fbe4e2; --tag-bg: #eceff4;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --surface: #1a1e27; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2e3442;
    --link: #8fb0ff; --focus: #8fb0ff;
    --ok: #6fcf97; --ok-bg: #173324; --warn: #e6b455; --warn-bg: #3a2c0f;
    --bad: #f28b82; --bad-bg: #3d1c1a; --tag-bg: #262b37;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 var(--sans); }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible, main:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px;
}
main:focus { outline: none; }
.top { border-bottom: 1px solid var(--line); background: var(--surface); }
.top-in, .page { max-width: 980px; margin: 0 auto; padding: 0 16px; }
.top-in { display: flex; align-items: baseline; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 600; color: var(--fg); text-decoration: none; }
.top .sub { color: var(--muted); font-size: .85rem; }
.page { padding-top: 16px; padding-bottom: 64px; }
nav.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 14px; overflow-wrap: anywhere; }
nav.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 2px 6px; }
nav.crumbs li + li::before { content: "\203A"; margin-right: 6px; color: var(--muted); }
h1 { font-size: 1.6rem; line-height: 1.2; font-weight: 600; margin: 0 0 4px; overflow-wrap: anywhere; }
h2 a, h2 .muted { text-transform: none; letter-spacing: 0; font-weight: 400; }
h2 { font-size: .75rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
     color: var(--muted); margin: 0 0 8px; }
p { margin: 0 0 10px; }
.lede { color: var(--muted); margin-bottom: 18px; max-width: 70ch; }
.muted, .none { color: var(--muted); }
.none { font-style: italic; }
.small { font-size: .82rem; }
.mono, code, pre { font-family: var(--mono); font-size: .86em; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
               padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
       padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; padding-top: 2px; }
.row > .l { min-width: 0; overflow-wrap: anywhere; }
.row > .r { color: var(--muted); text-align: right; min-width: 0; overflow-wrap: anywhere;
            font-variant-numeric: tabular-nums; flex-shrink: 0; max-width: 55%; }
.why { display: block; color: var(--muted); font-size: .82rem; line-height: 1.45; }
.pill { display: inline-block; font-size: .72rem; font-weight: 500; padding: 1px 8px; border-radius: 999px;
        background: var(--tag-bg); color: var(--muted); white-space: nowrap; vertical-align: 1px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pills { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: baseline; justify-content: flex-end; }
.pills > a { font-size: .78rem; }
.grp + .grp { margin-top: 12px; }
.grp h3 { font-size: .85rem; font-weight: 600; margin: 0 0 2px; }
/* fields */
dl.fields { margin: 0; }
dl.fields > div { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 4px 16px;
                  padding: 9px 0; border-top: 1px solid var(--line); }
dl.fields > div:first-child { border-top: 0; padding-top: 2px; }
dl.fields dt { font-family: var(--mono); font-size: .85rem; overflow-wrap: anywhere; }
dl.fields dt .why { font-family: var(--sans); white-space: pre-line; margin-top: 2px; }
dl.fields dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.val-text { white-space: pre-wrap; }
.clamp { max-height: 9.5em; overflow: hidden; position: relative; }
.raw { color: var(--muted); font-size: .8rem; margin-left: 6px; font-family: var(--mono); }
pre.json { margin: 4px 0 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; overflow-x: auto; white-space: pre; max-height: 30em; }
details > summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
button.link { font: inherit; font-size: .85rem; color: var(--link); background: none; border: 0;
              padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
button.more { font: inherit; font-size: .9rem; padding: 6px 14px; border: 1px solid var(--line);
              border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; margin-top: 10px; }
/* lists */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.list { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.list th, table.list td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line);
                               vertical-align: top; }
table.list th { border-top: 0; font-size: .7rem; letter-spacing: .07em; text-transform: uppercase;
                color: var(--muted); font-weight: 600; white-space: nowrap; }
table.list td { max-width: 22rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.list td.num { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; padding: 2px 4px 2px 10px;
        border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip a { text-decoration: none; padding: 0 6px; border-radius: 999px; }
.note { color: var(--muted); font-size: .88rem; }
.msg { border: 1px solid var(--line); border-left: 4px solid var(--muted); background: var(--surface);
       border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; max-width: 70ch; }
.msg.bad { border-left-color: var(--bad); }
.doc { white-space: pre-line; }
fieldset.fl { border: 0; padding: 0; margin: 0; }
fieldset.fl legend { padding: 0; margin-bottom: 3px; }
/* actions */
button.act, a.act { font: inherit; font-size: .88rem; padding: 5px 12px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none;
  display: inline-block; line-height: 1.4; }
button.act:hover, a.act:hover { border-color: var(--muted); }
button.act.primary { background: var(--link); border-color: var(--link); color: var(--bg); }
button.act.danger { color: var(--bad); border-color: var(--bad); }
button.act.small { font-size: .78rem; padding: 2px 9px; }
button.act:disabled { opacity: .55; cursor: default; }
button.act:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a.act:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
.panel { border: 1px solid var(--line); border-left: 4px solid var(--link); border-radius: 6px; background: var(--bg);
  padding: 12px 14px; margin: 10px 0 4px; }
.panel h3 { font-size: .95rem; margin: 0 0 8px; }
form.f { display: flex; flex-direction: column; gap: 10px; }
.fl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fl > span.lab { font-size: .82rem; font-weight: 600; }
.fl .why { font-weight: 400; }
.fl input[type=text], .fl input[type=password], .fl input[type=number], .fl input[type=search],
.fl input[type=datetime-local], .fl select, .fl textarea, input.wide, select.wide, textarea.wide {
  font: inherit; font-size: .92rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--fg); width: 100%; max-width: 34rem; min-width: 0; }
.fl textarea, textarea.wide { min-height: 5em; font-family: var(--mono); font-size: .85rem; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.checks label, label.check { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.err { color: var(--bad); font-size: .88rem; flex-basis: 100%; white-space: pre-line; }
.err:empty { display: none; }
.okmsg { color: var(--ok); font-size: .88rem; }
.confirm { border: 1px solid var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 10px 12px;
  margin: 8px 0; max-width: 40rem; }
.confirm p { margin: 0 0 8px; color: var(--fg); }
.msg.ok { border-left-color: var(--ok); }
.list-ed { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 8px; }
.list-ed .it { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.list-ed .it .nm { flex: 1 1 12rem; min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: .85rem; }
.list-ed select { font: inherit; font-size: .85rem; padding: 3px 6px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); color: var(--fg); }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.row .r .act { margin-left: 4px; }
@media (max-width: 640px) {
  dl.fields > div { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.35rem; }
  .row > .r { max-width: 50%; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="#/" data-nav>cclaw</a>
<span class="sub">your agents and their data</span></div></header>
<div class="page">
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<main id="main" tabindex="-1" aria-live="polite"></main>
</div>
<script>
"use strict";
/* Reading is generic: one list page and one row page serve every table,
   drawn from /admin/api/meta. Three tables get a few extra sections built
   from the same API (agents, providers, channels). Every value from the
   database is untrusted text and only ever reaches the page as textContent. */

var META = null, TABLES = {};
var MAIN = document.getElementById("main");
var CRUMBS = document.getElementById("crumbs");
var renderSeq = 0;

/* ── tiny DOM builder: strings become text nodes, never markup ── */
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
  el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

/* ── API ── */
function ApiError(status, message) { this.status = status; this.message = message; }
function api(what, params) {
  var qs = new URLSearchParams();
  if (params) for (var k in params) if (params[k] !== undefined && params[k] !== null) qs.set(k, params[k]);
  var url = "/admin/api/" + what + (qs.toString() ? "?" + qs.toString() : "");
  return fetch(url, { credentials: "same-origin", cache: "no-store" }).then(function (r) {
    return r.text().then(function (t) {
      var body = null;
      try { body = JSON.parse(t); } catch (e) { body = null; }
      if (!r.ok) throw new ApiError(r.status, body && body.error ? body.error : ("HTTP " + r.status));
      if (!body) throw new ApiError(r.status, "the server's answer was not JSON");
      return body;
    });
  }, function () { throw new ApiError(0, "the server could not be reached"); });
}
function rows(table, filter, limit, after) {
  return api("rows", { table: table, filter: filter ? JSON.stringify(filter) : null,
                       limit: limit || null, after: after ? JSON.stringify(after) : null });
}
function getRow(table, key) { return api("row", { table: table, key: JSON.stringify(key) }); }

/* ── names and values for people ── */
var TITLES = { cron_jobs: "Schedules", models_cache: "Models offered by providers",
  llm_responses: "LLM responses", llm_jobs: "LLM jobs", channel_chats: "Chats",
  agent_models: "Agent model lists", agent_memory_blocks: "Memory attachments",
  memory_notes: "Memory notes", secret_hosts: "Secret hosts", channel_outbox: "Channel outbox",
  config: "Settings" };
function title(t) {
  if (TITLES[t]) return TITLES[t];
  var s = t.replace(/_/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function colOf(t, c) {
  var m = TABLES[t];
  if (!m) return null;
  for (var i = 0; i < m.columns.length; i++) if (m.columns[i].name === c) return m.columns[i];
  return null;
}
function firstSentence(s) {
  if (!s) return "";
  var p = s.split("\n\n")[0].replace(/\n/g, " ");
  var m = p.match(/^(.{20,}?[.;:])(\s|$)/);
  return m ? m[1] : p;
}
function isObj(v) { return v !== null && typeof v === "object"; }
function fmtNum(n) { return typeof n === "number" ? n.toLocaleString() : String(n); }
function when(ts) {
  var d = new Date(ts * 1000);
  return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric",
                                       hour: "2-digit", minute: "2-digit" });
}
function ago(ts) {
  var s = Math.round(Date.now() / 1000 - ts), f = s < 0, a = Math.abs(s), u;
  if (a < 60) u = a + " s";
  else if (a < 3600) u = Math.round(a / 60) + " min";
  else if (a < 86400 * 2) u = Math.round(a / 3600) + " h";
  else if (a < 86400 * 60) u = Math.round(a / 86400) + " days";
  else return when(ts);
  return f ? "in " + u : u + " ago";
}
function codeWord(t, c, v) {
  var m = META.codes[t + "." + c];
  return m && m[String(v)] !== undefined ? m[String(v)] : null;
}
function looksJson(s) {
  if (typeof s !== "string") return null;
  var x = s.trim();
  if (!(x.charAt(0) === "{" && x.charAt(x.length - 1) === "}") &&
      !(x.charAt(0) === "[" && x.charAt(x.length - 1) === "]")) return null;
  try { return JSON.parse(x); } catch (e) { return null; }
}

/* Short form, for list cells and summaries. */
function shortVal(t, c, v) {
  var col = colOf(t, c) || {};
  if (v === null || v === undefined) return h("span", { class: "none", text: "none" });
  if (isObj(v)) {
    if (v.hidden) return h("span", { class: "pill", text: "hidden" });
    if (v.blob !== undefined) return h("span", { class: "muted", text: "binary, " + fmtNum(v.blob) + " bytes" });
    if (v.preview !== undefined) return h("span", { title: fmtNum(v.length) + " characters" }, v.preview + "…");
  }
  if (col.display === "code") {
    var w = codeWord(t, c, v);
    if (w !== null) return h("span", { title: String(v) }, w);
  }
  if (col.display === "bool" && (v === 0 || v === 1)) return v ? "yes" : "no";
  if (col.display === "time" && typeof v === "number" && v > 0)
    return h("span", { title: when(v) + " (" + v + ")" }, ago(v));
  return String(v);
}

/* Full form, for a row page. */
function longVal(t, c, v) {
  var col = colOf(t, c) || {};
  if (v === null || v === undefined) return h("span", { class: "none", text: "none" });
  if (isObj(v)) {
    if (v.hidden) return [h("span", { class: "pill", text: "hidden" }),
      h("span", { class: "why", text: "This value never leaves the server." })];
    if (v.blob !== undefined) return h("span", { class: "muted", text: "binary, " + fmtNum(v.blob) + " bytes (not shown)" });
    if (v.preview !== undefined) return [textBlock(v.preview),
      h("span", { class: "why", text: "Showing the first " + fmtNum(v.preview.length) + " of " +
                  fmtNum(v.length) + " characters." })];
  }
  if (col.display === "code") {
    var w = codeWord(t, c, v);
    if (w !== null) return [w, h("span", { class: "raw", text: String(v) })];
  }
  if (col.display === "bool" && (v === 0 || v === 1))
    return [v ? "yes" : "no", h("span", { class: "raw", text: String(v) })];
  if (col.display === "time" && typeof v === "number" && v > 0)
    return [when(v), h("span", { class: "muted", text: " · " + ago(v) }), h("span", { class: "raw", text: String(v) })];
  if (typeof v === "number") return col.pk || /(^|_)id$/.test(c) ? String(v) : fmtNum(v);
  var j = looksJson(v);
  if (j !== null) return jsonBlock(j);
  return textBlock(v);
}
function jsonBlock(j) {
  var text = JSON.stringify(j, null, 2), lines = text.split("\n").length;
  if (lines <= 1 || text.length < 60) return h("code", { text: text.replace(/\s*\n\s*/g, " ") });
  var n = Array.isArray(j) ? j.length + (j.length === 1 ? " item" : " items")
                           : Object.keys(j).length + (Object.keys(j).length === 1 ? " key" : " keys");
  return h("details", { open: lines <= 14 }, h("summary", { text: "JSON, " + n }),
           h("pre", { class: "json", text: text }));
}
function textBlock(s) {
  var long = s.length > 700 || s.split("\n").length > 8;
  var el = h("div", { class: "val-text" + (long ? " clamp" : ""), text: s });
  if (!long) return el;
  var btn = h("button", { class: "link", type: "button", text: "Show all " + fmtNum(s.length) + " characters" });
  btn.addEventListener("click", function () {
    var open = el.classList.toggle("clamp");
    btn.textContent = open ? "Show all " + fmtNum(s.length) + " characters" : "Show less";
  });
  return h("div", null, el, btn);
}

/* ── routes ── */
function keyFromSegments(t, segs) {
  var m = TABLES[t];
  return segs.map(function (s, i) {
    var name = m.key[i], col = colOf(t, name);
    var integer = name === "rowid" || (col && /INT/i.test(col.type));
    return integer && /^-?\d+$/.test(s) ? Number(s) : s;
  });
}
function rowHash(t, key) {
  return "#/r/" + encodeURIComponent(t) + "/" + key.map(function (k) {
    return encodeURIComponent(String(k));
  }).join("/");
}
function listHash(t, filter) {
  return "#/t/" + encodeURIComponent(t) +
         (filter && Object.keys(filter).length ? "?f=" + encodeURIComponent(JSON.stringify(filter)) : "");
}
function parseRoute(hash) {
  var hs = (hash || "").replace(/^#/, "");
  var q = "", i = hs.indexOf("?");
  if (i >= 0) { q = hs.slice(i + 1); hs = hs.slice(0, i); }
  var segs = hs.split("/").filter(function (s) { return s !== ""; }).map(function (s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  });
  var params = new URLSearchParams(q), filter = null;
  if (params.get("f")) { try { filter = JSON.parse(params.get("f")); } catch (e) { filter = "bad"; } }
  if (segs[0] === "tables") return { kind: "tables" };
  if (segs[0] === "add-provider") return { kind: "add-provider" };
  if (segs[0] === "t" && segs[1]) return { kind: "list", table: segs[1], filter: filter };
  if (segs[0] === "r" && segs[1] && segs.length > 2) return { kind: "row", table: segs[1], segs: segs.slice(2) };
  return { kind: "home" };
}
function filterText(f) {
  return Object.keys(f).map(function (k) {
    var v = f[k];
    return k + (v === null ? " is none" : Array.isArray(v) ? " in " + v.join(", ") : " = " + v);
  }).join(", ");
}

/* ── breadcrumbs: the path actually taken, kept in history.state ── */
function naturalTrail(route) {
  var t = [{ hash: "#/", label: "Home" }];
  if (route.kind === "tables") t.push({ hash: "#/tables", label: "All tables" });
  if (route.kind === "add-provider") {
    t.push({ hash: listHash("providers"), label: "Providers" });
    t.push({ hash: "#/add-provider", label: "New provider" });
  }
  if (route.kind === "list") t.push({ hash: location.hash, label: listLabel(route.table, route.filter) });
  if (route.kind === "row") {
    t.push({ hash: listHash(route.table), label: title(route.table) });
    t.push({ hash: location.hash, label: route.segs.join(" · ") });
  }
  return t;
}
function listLabel(t, f) {
  return title(t) + (f && f !== "bad" && Object.keys(f).length ? " (" + filterText(f) + ")" : "");
}
function currentTrail() {
  var st = history.state;
  if (st && Array.isArray(st.trail) && st.trail.length &&
      st.trail[st.trail.length - 1].hash === location.hash) return st.trail;
  return naturalTrail(parseRoute(location.hash));
}
function navigate(hash, label) {

/* Pick a channel, then one of its chats; calls onPick(chat, session) when it changes. */

  var wrap = h("div", { class: "f" }), chSel = selectIn("channel", [["", "Loading…"]], ""), chatSel = selectIn("chat", [["", "Pick a channel first"]], "");

function noteEditor(blockId, n) {
  var shown = h("div", null, h("div", { class: "note-text", text: n.values.text }));
  var bar = h("span", { class: "pills" });
  var line = rowLine(shown, bar);
  bar.appendChild(h("span", { class: "muted small", text: ago(n.values.updated_at) }));
  bar.appendChild(btn("Edit", function () {
    var ta = areaIn("text", n.values.text, 4);
    var f = formBox([fieldIn("Note #" + n.key[0], ta)], "Save", function (form) {
      return submitAct("memory_note_edit", { block_id: blockId, note_id: n.key[0], text: val(form, "text") });
    }, { cancel: function () { clear(shown); shown.appendChild(h("div", { class: "note-text", text: n.values.text })); } });
    f.addEventListener("keydown", function (e) { if (e.key === "Escape") { e.preventDefault(); clear(shown); shown.appendChild(h("div", { class: "note-text", text: n.values.text })); } });
    clear(shown);
    shown.appendChild(f);
    ta.focus();
  }, "small"));
  bar.appendChild(confirmBtn("Delete", "Delete note #" + n.key[0] + "? Agents that have this block stop seeing it.", "Delete the note",
    function () { return act("memory_note_delete", { block_id: blockId, note_id: n.key[0] }); }));
  return line;
}

/* ── chats, channels ── */
function chatSettingsPanel(v, tools) {
  var filt = toolFilterEditor("tf", v.tool_filter, tools);
  return formBox([fieldIn("Replies", selectIn("delivery_mode", [["auto", "Auto: the agent's final message is posted"],
      ["explicit", "Explicit: nothing is posted unless the agent calls channel_send"]].concat(
      v.delivery_mode !== "auto" && v.delivery_mode !== "explicit" ? [[v.delivery_mode, v.delivery_mode + " (set elsewhere)"]] : []), v.delivery_mode)),
    filt, fieldIn("Guidance", areaIn("guidance", v.guidance || "", 4), "Appended to the system prompt of this chat's sessions. Empty for none.")],
    "Save", function (form) {
      var fields = { channel: v.channel_name, chat_id: v.chat_id, tool_filter: filt.value(), guidance: val(form, "guidance") };
      if (val(form, "delivery_mode") === "auto" || val(form, "delivery_mode") === "explicit") fields.delivery_mode = val(form, "delivery_mode");
      return submitAct("chat_settings", fields);
    });
}

function channelDefaultsPanel(v, agents, tools) {
  var agentSel = selectIn("default_agent", [["", "Nobody: drop them and tell me once per chat"]].concat(agents.map(function (a) { return [a, a]; })), v.default_agent || "");
  var filt = toolFilterEditor("dtf", v.default_tool_filter, tools);
  return formBox([fieldIn("Chats nobody routed", agentSel, "With an agent here, anyone who writes in a new chat gets a session with it."),
    filt, h("p", { class: "note", text: "The tools above are what each new chat starts with; existing chats keep theirs." })],
    "Save", function (form, ctx) {
      var fields = { channel: v.name, default_agent: val(form, "default_agent") || null, default_tool_filter: filt.value() };
      if (fields.default_agent && fields.default_agent !== v.default_agent) {
        confirmBox(ctx.row, "Anyone who writes to this channel in a chat nobody routed will get a session with " + fields.default_agent +
          ", with " + (fields.default_tool_filter === "unrestricted" ? "all of its grants" : "these tools only: " + fields.default_tool_filter.join(", ")) + ".",
          "Open the door", function () { return act("channel_defaults", fields); });
        return;
      }
      return submitAct("channel_defaults", fields);
    });
}

/* ── approvals ── */
function approvalCard(id, state, seq, container) {
  var body = h("div", null, h("p", { class: "muted", text: "Loading the request…" }));
  container.appendChild(body);
  api("approval", { id: id }).then(function (c) {
    if (!page(seq)) return;
    clear(body);
    body.appendChild(h("pre", { class: "json", text: c.summary }));
    var bar = h("div", { class: "actions" });
    function decide(d) {
      act("approval_decide", { approval_id: id, decision: d }).then(function (r) { refresh(r.message); }, function (e) { err.textContent = e.message; });
    }
    if (c.state === "pending" && c.resolve === "apply") {
      /* A request applied as a whole (resolve.c): approve or deny, no "once". */
      bar.appendChild(confirmBtn("Approve", "Apply this request as shown above. What it grants stays granted.",
        "Approve it", function () { return act("approval_decide", { approval_id: id, decision: "always" }); }, "primary"));
    } else if (c.state === "pending") {
      bar.appendChild(btn("Approve once", function () { decide("once"); }, "primary"));
      if (c.park_reason !== "sensitive_target")
        bar.appendChild(confirmBtn("Always allow", "Approve this, and let the agent make this call again without asking (the grant stays).",
          "Always allow", function () { return act("approval_decide", { approval_id: id, decision: "always" }); }, "act"));
    }
    if (c.state === "pending") {
      bar.appendChild(btn("Deny", function () { decide("deny"); }, "danger"));
    } else if (c.state === "denied" && c.tool_name === "request_config") {
      bar.appendChild(confirmBtn("Grant it now", "Apply what this denied request asked for, as if you had approved it. It is recorded as a new approval.",
        "Grant it", function () { return act("approval_grant_from_history", { approval_id: id }); }, "act"));
    }
    var err = h("div", { class: "err", role: "alert" });
    bar.appendChild(err);
    body.appendChild(bar);
  }, function (e) { clear(body); body.appendChild(h("div", { class: "err", text: e.message })); });
}

/* ── secrets ── */
function addSecretPanel() {
  var value = h("input", { type: "password", name: "value", autocomplete: "new-password" });
  return formBox([fieldIn("Name", textIn("name", "", { placeholder: "GITHUB_TOKEN" }), "Capital letters, digits and _."),
    fieldIn("Value", value, "Stored encrypted. It is never shown again, and never reaches a model."),
    fieldIn("Scope", selectIn("scope", [["agent", "Agent: usable by the agents you grant it to"], ["system", "System: a provider key, used by the daemon only"]], "agent"))],
    "Store it", function (form) {
      var v = value.value;
      value.value = "";
      return submitAct("secret_add", { name: val(form, "name").trim(), value: v, scope: val(form, "scope") });
    });
}

function editBlockPanel(v) {
  return formBox([fieldIn("Description", textIn("description", v.description || "")),
    fieldIn("Placement", selectIn("placement", [["context", "Each turn's context (changes show next turn)"],
                                              ["system", "The system prompt (changes show next session)"]], v.placement)),
    fieldIn("Character limit", textIn("char_limit", v.char_limit, { inputmode: "numeric" }), "For agents; your own edits are not bound by it."),
    checkIn("read_only", "Read only for every agent", v.read_only)],
    "Save", function (form) {
      return submitAct("memory_block_edit", { block_id: v.id, description: val(form, "description"),
        placement: val(form, "placement"), char_limit: val(form, "char_limit").trim(), read_only: val(form, "read_only") });
    });
}

function hostsEditor(name, hosts) {
  var list = hosts.slice(), items = h("div", { class: "list-ed", role: "list" }), err = h("div", { class: "err", role: "alert" });
  var input = textIn("host", "", { placeholder: "api.github.com, or .github.com", "aria-label": "Host to allow" });
  function save(next, widen, anchor) {
    var run = function () { return act("secret_hosts_set", { name: name, hosts: next }); };
    if (widen) { confirmBox(anchor, name + " may then be sent to " + widen + ". A tool call can carry it there.", "Allow it", run); return; }
    err.textContent = "";
    run().then(function (r) { refresh(r.message); }, function (e) { err.textContent = e.message; });
  }
  function draw() {
    clear(items);
    if (!list.length) items.appendChild(h("p", { class: "none", text: "No host: a tool call that uses this secret is refused." }));
    list.forEach(function (hst, i) {
      var rm = btn("Remove", function () { save(list.filter(function (_, j) { return j !== i; })); }, "small");
      rm.setAttribute("aria-label", "Stop allowing " + hst);
      items.appendChild(h("div", { class: "it", role: "listitem" }, h("span", { class: "nm", text: hst }), rm));
    });
  }
  draw();
  var addRow = h("div", { class: "actions" });
  var addB = btn("Allow", function () {
    var v = input.value.trim();
    if (!v) { err.textContent = "Type a host first."; return; }
    save(list.concat([v]), v, addRow);
  }, "small");
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addB.click(); } });
  add(addRow, [input, addB, err]);
  return [items, addRow];
}

SHAPED.models = function (res, el, seq) {
  var v = res.row.values;
  var rm = confirmBtn("Remove", "Remove " + v.id + "? It is refused while any agent's list names it.", "Remove the model",
    function () { return act("model_remove", { id: v.id }).then(function (r) { FLASH = r.message; navigate(rowHash("providers", [v.provider_name]), v.provider_name); return null; }); }, "danger");
  el.appendChild(h("div", { class: "bar" }, opener("Edit", "Edit " + v.id, function () { return editModelPanel(v); }), rm));
};

SHAPED.memory_blocks = function (res, el, seq) {
  var v = res.row.values, id = res.row.key[0];
  var nAtt = countIn(res, "agent_memory_blocks", "block_id"), nNotes = countIn(res, "memory_notes", "block_id");
  var del = confirmBtn("Delete the block", "Delete " + v.label + " and its " + nNotes + " note" + (nNotes === 1 ? "" : "s") +
    (nAtt ? "? It is detached from " + nAtt + " agent" + (nAtt === 1 ? "" : "s") + ", and leaves their prompts." : "?"),
    "Delete it", function () {
      return act("memory_block_delete", { block_id: id }).then(function (r) { FLASH = r.message; navigate(listHash("memory_blocks"), "Memory blocks"); return null; });
    }, "danger");
  el.appendChild(h("div", { class: "bar" }, opener("Edit", "Edit " + v.label, function () { return editBlockPanel(v); }), del));
  sub(el, "Attached to", seq, Promise.all([allRows("agent_memory_blocks", { block_id: id }), allRows("agents")]), function (r) {
    var att = r[0], names = r[1].map(function (x) { return x.key[0]; }), list = h("div", { class: "rows" });
    att.forEach(function (x) {
      var a = x.values.agent_name, ro = x.values.read_only || v.read_only, bar = h("span", { class: "pills" });
      bar.appendChild(pill(ro ? "read only" : "reads and writes", ro ? "" : "ok"));
      if (a === v.created_by) bar.appendChild(pill("made it"));
      if (x.values.read_only)
        bar.appendChild(confirmBtn("Make writable", a + " will be able to write this block" + (att.length > 1 ? ". It is shared: what " + a +
          " writes reaches the prompts of the other " + (att.length - 1) + " agent" + (att.length === 2 ? "" : "s") + "." : "."),
          "Make it writable", function () { return act("memory_attach", { block_id: id, agent: a, read_only: false }); }));
      else bar.appendChild(btn("Make read only", function () {
        act("memory_attach", { block_id: id, agent: a, read_only: true }).then(function (r) { refresh(r.message); });
      }, "small"));
      bar.appendChild(confirmBtn("Detach", a + " will no longer see this block. The block and its notes stay.", "Detach",
        function () { return act("memory_detach", { block_id: id, agent: a }); }));
      list.appendChild(rowLine(link(rowHash("agents", [a]), a), bar));
    });
    var others = names.filter(function (n) { return !att.some(function (x) { return x.values.agent_name === n; }); });
    var attach = opener("Attach to an agent", "Attach " + v.label, function () {
      var sel = selectIn("agent", [["", others.length ? "Pick an agent…" : "Every agent has it"]].concat(others.map(function (n) { return [n, n]; })), "");
      return formBox([fieldIn("Agent", sel), checkIn("read_only", "Read only (the default)", true)], "Attach", function (form, ctx) {
        if (!sel.value) { ctx.err.textContent = "Pick an agent."; return; }
        var fields = { block_id: id, agent: sel.value, read_only: val(form, "read_only") };
        if (!fields.read_only) {
          confirmBox(ctx.row, sel.value + " will be able to write this block" + (att.length ? "; what it writes reaches the prompts of " +
            att.map(function (x) { return x.values.agent_name; }).join(", ") : "") + ".", "Attach writable", function () { return act("memory_attach", fields); });
          return;
        }
        return submitAct("memory_attach", fields);
      });
    });
    return [att.length ? list : emptyLine("No agent has this block: nobody sees it."), attach];
  });
  sub(el, "Notes", seq, allRows("memory_notes", { block_id: id }), function (notes) {
    notes.sort(function (a, b) { return a.key[0] - b.key[0]; });
    var used = notes.reduce(function (n, x) { return n + (x.values.text || "").length; }, 0);
    var list = h("div", { class: "rows" });
    notes.forEach(function (n) { list.appendChild(noteEditor(id, n)); });
    var addF = formBox([fieldIn("New note", areaIn("text", "", 3))], "Add the note", function (form) {
      return submitAct("memory_note_add", { block_id: id, text: val(form, "text") });
    });
    return [h("p", { class: "note", text: fmtNum(used) + " of " + fmtNum(v.char_limit) + " characters used. Agents see the notes oldest first." }),
            notes.length ? list : emptyLine("No notes yet."), addF];
  });
};

SHAPED.channel_chats = function (res, el, seq) {
  var v = res.row.values, label = v.title || v.chat_id;
  var who = section("Who it talks to", h("p", { class: "muted", text: "Loading…" }));
  el.appendChild(who);
  var load = v.session_id !== null ? getRow("sessions", [v.session_id]) : Promise.resolve(null);
  Promise.all([load, allRows("agents")]).then(function (r) {
    if (!page(seq)) return;
    var body = h("div"), s = r[0] && r[0].row.values, agents = r[1].map(function (x) { return x.key[0]; });
    if (s) {
      body.appendChild(rowLine(h("span", null, "Session ", link(rowHash("sessions", [v.session_id]), "#" + v.session_id), " with ",
        link(rowHash("agents", [s.agent_name]), s.agent_name)), pill("routed", "ok")));
      body.appendChild(h("div", { class: "actions", style: "margin-top:8px" }, confirmBtn("Unroute",
        label + " stops talking to " + s.agent_name + ". Session #" + v.session_id + " keeps its history; the chat's next message is dropped " +
        "(you are told once), unless the channel's default agent takes it.", "Unroute it",
        function () { return act("chat_unroute", { channel: v.channel_name, chat_id: v.chat_id }); }, "danger")));
    } else {
      body.appendChild(rowLine("Nobody: its messages are dropped" + (v.notified_at ? " (you were told " + ago(v.notified_at) + ")" : "") + ".", pill("not routed")));
      body.appendChild(opener("Route to an agent", "Route " + label, function () {
        var sel = selectIn("agent", [["", "Pick an agent…"]].concat(agents.map(function (a) { return [a, a]; })), "");
        return formBox([fieldIn("Agent", sel, "A new session with this agent answers the chat.")], "Route it", function (form, ctx) {
          if (!sel.value) { ctx.err.textContent = "Pick an agent."; return; }
          confirmBox(ctx.row, "Everyone in " + label + " will reach " + sel.value + ", with " + sel.value + "'s grants" +
            (v.tool_filter ? " narrowed to this chat's tools" : "") + ".", "Route it", function () {
              return act("session_new_on_chat", { agent: sel.value, channel: v.channel_name, chat_id: v.chat_id });
            });
        });
      }));
    }
    who.replaceChild(body, who.lastChild);
  });
  sub(el, "Settings", seq, toolNames(), function (tools) {
    var tf = looksJson(v.tool_filter), list = h("div", { class: "rows" });
    list.appendChild(rowLine("Replies", v.delivery_mode === "explicit" ? "only what the agent sends with channel_send" :
      v.delivery_mode === "auto" ? "the final message is posted" : v.delivery_mode));
    list.appendChild(rowLine("Tools", Array.isArray(tf) ? tf.join(", ") : "unrestricted"));
    list.appendChild(rowLine("Guidance", v.guidance ? h("span", { class: "note-text", text: v.guidance }) : h("span", { class: "none", text: "none" })));
    return [list, opener("Change settings", "Settings for " + label, function () { return chatSettingsPanel(v, tools); })];
  });
};

SHAPED.approvals = function (res, el, seq) {
  var sec = section("The request", []);
  el.appendChild(sec);
  approvalCard(res.row.key[0], res.row.values.state, seq, sec);
};

SHAPED.secrets = function (res, el, seq) {
  var name = res.row.key[0], v = res.row.values;
  var nHosts = 0, nGrants = 0;
  var value = h("input", { type: "password", name: "value", autocomplete: "new-password" });
  var replace = opener("Replace the value", "Replace the value of " + name, function () {
    return formBox([fieldIn("New value", value, "Who may use it, and where it may go, stay as they are.")], "Replace", function () {
      var nv = value.value;
      value.value = "";
      return submitAct("secret_add", { name: name, value: nv, scope: v.scope, replace: true });
    });
  });
  var bar = h("div", { class: "bar" }, replace);
  el.appendChild(bar);
  if (v.scope === "system") {
    el.appendChild(section("Used by", h("p", { class: "note", text: "A system secret: a provider key, used by the daemon only. No agent can be granted it, and allowed hosts do not apply." })));
    bar.appendChild(confirmBtn("Remove", "Remove " + name + "? Its value is gone for good.", "Remove it",
      function () { return act("secret_remove", { name: name }).then(function (r) { FLASH = r.message; navigate(listHash("secrets"), "Secrets"); return null; }); }, "danger"));
    return;
  }
  Promise.all([allRows("secret_hosts", { secret_name: name }), allRows("grants", { kind: "secret", value: name }), allRows("agents")]).then(function (r) {
    if (!page(seq)) return;
    nHosts = r[0].length; nGrants = r[1].length;
    bar.appendChild(confirmBtn("Remove", "Remove " + name + ": its value, its " + nHosts + " allowed host" + (nHosts === 1 ? "" : "s") +
      " and the " + nGrants + " grant" + (nGrants === 1 ? "" : "s") + " that let agents use it all go.", "Remove it",
      function () { return act("secret_remove", { name: name }).then(function (r) { FLASH = r.message; navigate(listHash("secrets"), "Secrets"); return null; }); }, "danger"));
    el.appendChild(section("Where it may be sent", hostsEditor(name, r[0].map(function (x) { return x.values.host; }))));
    var list = h("div", { class: "rows" }), granted = r[1].map(function (x) { return x.values.agent_name; });
    r[1].forEach(function (x) {
      var a = x.values.agent_name;
      list.appendChild(rowLine(link(rowHash("agents", [a]), a), h("span", { class: "pills" }, pill("from " + x.values.source),
        confirmBtn("Revoke", a + " will no longer be able to use " + name + ".", "Revoke",
          function () { return act("grant_remove", { agent: a, kind: "secret", value: name }); }))));
    });
    var others = r[2].map(function (x) { return x.key[0]; }).filter(function (n) { return granted.indexOf(n) < 0; });
    var grant = opener("Let an agent use it", "Grant " + name, function () {
      var sel = selectIn("agent", [["", others.length ? "Pick an agent…" : "Every agent may use it"]].concat(others.map(function (n) { return [n, n]; })), "");
      return formBox([fieldIn("Agent", sel)], "Grant", function (form, ctx) {
        if (!sel.value) { ctx.err.textContent = "Pick an agent."; return; }
        confirmBox(ctx.row, sel.value + " will be able to use " + name + " in its tool calls, sent only to the allowed hosts.", "Grant it",
          function () { return act("grant_add", { agent: sel.value, kind: "secret", value: name }); });
      });
    });
    el.appendChild(section("Agents that may use it", [granted.length ? list : emptyLine("Nobody: no agent may use it yet."), grant]));
  });
};

/* List pages that offer a way to add one. */
var LISTX = {
  providers: function (el) { el.appendChild(h("div", { class: "bar" }, h("a", { class: "act", href: "#/add-provider", "data-nav": true, "data-label": "New provider", text: "Add a provider" }))); },

  approvals: function (el, seq) {

    el.appendChild(box);
    rows("approvals", { state: "pending" }, 20).then(function (r) {

      r.rows.forEach(function (x) {
        var sec = section(["Waiting: ", link(rowHash("approvals", x.key), "#" + x.key[0]), " ", h("span", { class: "muted", text: (x.values.tool_name || "") + ", session " + x.values.session_id })], []);

};

/* ── dispatch ── */
function render() {
  var seq = ++renderSeq, route = parseRoute(location.hash);
  SHOWN_FLASH = FLASH;
  FLASH = null;
  drawCrumbs(currentTrail());
  if (route.kind === "home") renderHome();
  else if (route.kind === "tables") renderTables();
  else if (route.kind === "list") renderList(route, seq);
  else if (route.kind === "add-provider") addProviderPage();
  else renderRow(route, seq);
  window.scrollTo(0, 0);
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest("#main, #crumbs"))
    MAIN.focus({ preventScroll: true });
}
function start() {
  loading();
  api("meta").then(function (m) {
    setMeta(m);
    if (!history.state) history.replaceState({ trail: naturalTrail(parseRoute(location.hash)) }, "", location.hash || "#/");
    render();
  }, function (err) { failure(err, "the description of the database"); });
}
start();
