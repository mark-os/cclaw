# Custom CClaw DLP rules — supplements vendor/gitleaks.toml.
#
# These close gaps that gitleaks.toml either lacks or that the generator drops
# (its jwt rule degenerates into an "ey"+{0,2} matcher; see gen_secret_scan.py).
# Same [[rules]] shape gitleaks uses: id, keywords (the AC anchors), regex (only
# parsed for vtype/charset/tail), entropy. Rule ids must also appear in
# CURATED_IDS in scripts/gen_secret_scan.py.

# HTTP Authorization: Bearer <token>. The generic-api-key rule can't catch this
# — it extracts the value as the first whitespace token ("Bearer", all-alpha,
# rejected) and never sees the credential. Anchor includes the trailing space so
# the tail begins at the token. ALNUM tail covers JWTs (dots) and opaque base64.
[[rules]]
id = "http-authorization-bearer"
keywords = ["bearer "]
regex = '''(?i)bearer ([a-zA-Z0-9_\-\.\+/=]{16,2048})'''
entropy = 3.5

# HTTP Authorization: Basic <base64(user:pass)>. Entropy can't separate weak
# creds from prose — base64("admin:admin") scores *lower* than the word
# "authentication". So this uses the base64 validator: decode the tail and
# require printable ASCII containing ':' (the user:pass shape). Catches weak
# passwords; rejects plain words. entropy is unused for this validator.
[[rules]]
id = "http-authorization-basic"
keywords = ["basic "]
regex = '''(?i)basic ([a-zA-Z0-9_\-\.\+/=]{12,1024})'''
validator = "base64"
entropy = 0.0

# Standalone JWT (eyJ + base64url + two dots). The ALNUM tail (incl. '.') spans
# header.payload.signature in one run. Anchor "eyj" is short, so the entropy
# floor and tail_min do the discriminating work.
[[rules]]
id = "jwt-token"
keywords = ["eyj"]
regex = '''(?i)eyj([a-zA-Z0-9_\-\.\+/=]{40,4096})'''
entropy = 4.0

# Slack token variants not in the existing xoxb/xoxp/xoxe set.
[[rules]]
id = "slack-misc-token"
keywords = ["xoxa-", "xoxr-", "xoxs-"]
regex = '''(?i)xox[ars]-([a-zA-Z0-9-]{10,1024})'''
entropy = 3.0

# Slack app-level token.
[[rules]]
id = "slack-app-token"
keywords = ["xapp-"]
regex = '''(?i)xapp-([a-zA-Z0-9-]{10,1024})'''
entropy = 3.0
